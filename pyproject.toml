[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "orbixal-connector-consumer-sdk"
version = "0.1.0"
description = "Internal-first consumer SDK for Orbixal connector runtime access"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1.0",
]
keywords = [
  "orbixal",
  "connectors",
  "sdk",
  "runtime",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/connector_consumer_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"src/connector_consumer_sdk/py.typed" = "connector_consumer_sdk/py.typed"
